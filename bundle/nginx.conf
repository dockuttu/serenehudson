server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # compression (HTML is gzipped by default once gzip is on)
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript application/json application/xml text/xml text/plain image/svg+xml application/rss+xml;

    # branded not-found page
    error_page 404 /404.html;
    location = /404.html { internal; }

    # blog moved to blog.serenemedspas.com (permanent)
    location ~ ^/blog(?:/(.*))?$ { return 301 https://blog.serenemedspas.com/$1; }

    location ~* \.(jpg|jpeg|png|webp|gif|ico|css|js)$ { expires 30d; add_header Cache-Control "public"; add_header Access-Control-Allow-Origin "*"; }
    location / { try_files $uri $uri/ =404; }
}
