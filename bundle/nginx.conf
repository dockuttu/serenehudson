server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # blog moved to blog.serenemedspas.com (permanent)
    location ~ ^/blog(?:/(.*))?$ { return 301 https://blog.serenemedspas.com/$1; }

    location ~* \.(jpg|jpeg|png|webp|gif|ico|css|js)$ { expires 30d; add_header Cache-Control "public"; }
    location / { try_files $uri $uri/ =404; }
}
