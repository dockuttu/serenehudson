server {
    listen 80;
    server_name _;

    # Phase 3 (Sep 23, 2026): the Hudson site now lives at serenemedspas.com/hudson/
    # This container only redirects. Keep it (and its certificate) for at least 12 months so old
    # links, Google Ads final URLs, GBP and printed material keep working.
    location = /blog { return 301 https://blog.serenemedspas.com/; }
    location ~ ^/blog/(.*)$ { return 301 https://blog.serenemedspas.com/$1; }
    location = /sitemap.xml { return 301 https://serenemedspas.com/hudson/sitemap.xml; }
    location = /robots.txt { return 200 "User-agent: *\nDisallow:\nSitemap: https://serenemedspas.com/hudson/sitemap.xml\n"; add_header Content-Type text/plain; }
    location / { return 301 https://serenemedspas.com/hudson$request_uri; }
}
